server {
  listen 80;
  server_name recordly.techdev api.recordly.techdev;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name recordly.techdev;

  ssl_certificate     /etc/nginx/certs/local-cert.pem;
  ssl_certificate_key /etc/nginx/certs/local-key.pem;

  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  server_name api.recordly.techdev;
  client_max_body_size 25m;

  ssl_certificate     /etc/nginx/certs/local-cert.pem;
  ssl_certificate_key /etc/nginx/certs/local-key.pem;

  location / {
    proxy_pass http://backend:5001;
    proxy_buffering off;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
